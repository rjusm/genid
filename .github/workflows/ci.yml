name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        if: runner.os != 'Windows'
        run: shellcheck genid.sh tests.sh
      - name: Run tests
        shell: bash
        run: bash ./tests.sh
